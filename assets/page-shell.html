<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="REPLACE_WITH_PAGE_DESCRIPTION">
  <title>REPLACE_WITH_TITLE</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3efe5;
      --ink: #1d1c19;
      --muted: #69655c;
      --accent: #bc4936;
      --accent-on: #ffffff;
      --line: rgba(29, 28, 25, 0.18);
      --measure: 68ch;
      --gutter: clamp(1rem, 4vw, 4.5rem);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 clamp(1rem, 0.95rem + 0.2vw, 1.15rem)/1.65 ui-serif, Georgia, serif;
      text-rendering: optimizeLegibility;
      text-wrap: pretty;
    }

    .skip-link {
      position: fixed;
      z-index: 10;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.6rem 0.85rem;
      background: var(--ink);
      color: var(--paper);
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: none; }

    .hero,
    .chapter {
      padding: clamp(4rem, 10vw, 9rem) var(--gutter);
    }

    .hero {
      min-height: 85svh;
      display: grid;
      align-content: end;
      border-bottom: 1px solid var(--line);
    }

    h1,
    h2 {
      max-width: 14ch;
      margin: 0.25em 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      line-height: 0.96;
      letter-spacing: -0.055em;
    }

    h1 { font-size: clamp(3.2rem, 10vw, 9.5rem); }
    h2 { font-size: clamp(2.2rem, 6vw, 5.5rem); }

    .lede,
    .prose { max-width: var(--measure); }

    .lede {
      margin-top: 2rem;
      color: var(--muted);
      font-size: clamp(1.15rem, 2vw, 1.6rem);
    }

    .chapter {
      min-height: 70svh;
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
      gap: clamp(2rem, 7vw, 8rem);
      border-bottom: 1px solid var(--line);
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    @media (max-width: 720px) {
      .chapter { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    @media print {
      body { background: #fff; color: #000; }
      .hero, .chapter { min-height: auto; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content">
    <article>
      <header class="hero">
        <h1>REPLACE_WITH_TITLE</h1>
        <p class="lede">REPLACE_WITH_OPENING_SUMMARY</p>
      </header>

      <section class="chapter" aria-labelledby="chapter-one-title">
        <div>
          <h2 id="chapter-one-title">REPLACE_WITH_SECTION_TITLE</h2>
        </div>
        <div class="prose">
          <p>REPLACE_WITH_SOURCE_CONTENT</p>
        </div>
      </section>
    </article>
  </main>

</body>
</html>
