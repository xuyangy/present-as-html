<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="REPLACE_WITH_PAGE_DESCRIPTION">
  <title>REPLACE_WITH_TITLE</title>
  <style>
    :root {
      /* Replace these neutral roles with the selected recipe or brand system. */
      color-scheme: light;
      --page: #ffffff;
      --text: #171717;
      --muted: #5f5f5f;
      --accent: #2255cc;
      --line: #d8d8d8;
      --measure: 68ch;
      --gutter: clamp(1rem, 4vw, 4rem);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body,
    h1,
    h2,
    p { margin: 0; }

    body {
      background: var(--page);
      color: var(--text);
      font: 400 clamp(1rem, 0.97rem + 0.15vw, 1.125rem)/1.65 system-ui, sans-serif;
      text-rendering: optimizeLegibility;
      text-wrap: pretty;
    }

    img,
    svg,
    video {
      display: block;
      max-width: 100%;
    }

    /* Repeat min-width: 0 for children of every grid or flex container added. */
    .hero > *,
    .chapter > * { min-width: 0; }

    /* Keep role="region", tabindex="0", and an accessible name on wide scrollers. */
    .scroll-x { overflow-x: auto; }

    .skip-link {
      position: fixed;
      z-index: 10;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.6rem 0.85rem;
      background: var(--text);
      color: var(--page);
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: none; }

    .hero,
    .chapter {
      padding: clamp(3rem, 8vw, 7rem) var(--gutter);
    }

    .hero { border-bottom: 1px solid var(--line); }

    h1,
    h2 {
      max-width: 18ch;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    h1 { font-size: clamp(2.5rem, 7vw, 6rem); }
    h2 { font-size: clamp(1.75rem, 4vw, 3.5rem); }

    .lede,
    .prose { max-width: var(--measure); }

    /* (0,2,0) so component margin: 0 rules can't collapse the flow spine. */
    .prose.prose > * + * { margin-top: 1.1em; }

    .lede {
      margin-top: 2rem;
      color: var(--muted);
      font-size: clamp(1.125rem, 2vw, 1.5rem);
    }

    .chapter {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
      gap: clamp(2rem, 6vw, 6rem);
      border-bottom: 1px solid var(--line);
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    @media (max-width: 720px) {
      .chapter { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    @media print {
      body { background: #fff; color: #000; }
      .skip-link { display: none; }
      .hero, .chapter { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content">
    <article>
      <header class="hero">
        <h1>REPLACE_WITH_TITLE</h1>
        <p class="lede">REPLACE_WITH_OPENING_SUMMARY</p>
      </header>

      <section class="chapter" aria-labelledby="chapter-one-title">
        <div>
          <h2 id="chapter-one-title">REPLACE_WITH_SECTION_TITLE</h2>
        </div>
        <div class="prose">
          <p>REPLACE_WITH_SOURCE_CONTENT</p>
        </div>
      </section>
    </article>
  </main>

</body>
</html>
